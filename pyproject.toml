[project]
name = "aicorp"
version = "0.1.0"
description = "A local-first AI office for one person: employees, tasks, approvals, an audit log and a live dashboard. No built-in AI, no API keys."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Md Irfan Ali" }]
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
    "playwright",
    "psutil",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aicorp = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient.:Warning"]

[tool.ruff]
line-length = 200
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F"]            # syntax errors and pyflakes: unused imports/variables, undefined names
