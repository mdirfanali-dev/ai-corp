name: CI

# Fork pull requests run with a read-only token and no secrets (the plain pull-request trigger, never the privileged one).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Lint
        run: ruff check src scripts tests
      - name: Public-repository checks (secrets, paths, e-mail addresses, licence files)
        run: python scripts/public_gates.py --check-only
      - name: Tests
        env:
          CI: "true"
        run: pytest -q
